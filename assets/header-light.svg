<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Martí Aguilera</title>
  <desc id="d">Developer and designer from Igualada, Catalonia. DAM student and co-founder of NuviaDev.</desc>
  <style>
    .name{font:800 76px 'Schibsted Grotesk','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;letter-spacing:-2.5px;fill:#1c2622}
    .role{font:500 26px 'Schibsted Grotesk','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#56615c;letter-spacing:-.3px}
    .k{font:400 13px 'Fragment Mono',ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace;fill:#56615c;letter-spacing:1.5px}
    .v{font:500 17px 'Schibsted Grotesk','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#1c2622}
    .sig{fill:#1f7a4a}
    .meta{font:400 13px 'Fragment Mono',ui-monospace,'SF Mono','Cascadia Mono',Consolas,Menlo,monospace;fill:#56615c;letter-spacing:1px}
    .rule line,.frame{stroke:#cfd6d2;stroke-width:1;fill:none}
    .accent{fill:#1f7a4a}
    .in{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    .row{opacity:0;animation:fade .6s ease-out forwards}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) .1s forwards}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
    .caret{animation:blink 1.1s steps(1) infinite}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(3.2);opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.in,.row{opacity:1;animation:none}.draw{stroke-dashoffset:0;animation:none}.pulse,.caret{animation:none}}
  </style>
  <rect width="1200" height="340" rx="14" fill="#f4f6f4"/>

  <!-- sheet frame and corner registration marks -->
  <rect x="24" y="24" width="1152" height="292" rx="6" class="frame draw" pathLength="1"/>
  <g class="rule"><line x1="60" y1="276" x2="740" y2="276" class="draw" pathLength="1"/></g>

  <text x="60" y="58" class="meta in" style="animation-delay:.05s">SHEET 01 / PROFILE</text>
  <text x="1140" y="58" class="meta in" text-anchor="end" style="animation-delay:.05s">REV. 2026</text>

  <g class="in" style="animation-delay:.15s">
    <text x="56" y="176" class="name">Martí Aguilera<tspan class="accent">.</tspan></text>
  </g>
  <g class="in" style="animation-delay:.3s">
    <text x="60" y="222" class="role">Developer &amp; Designer. Creating digital experiences<tspan x="60" dy="34">with software, design and innovation.</tspan><tspan class="accent caret" dx="4">▍</tspan></text>
  </g>

  <text x="60" y="302" class="meta in" style="animation-delay:.6s">REACT · TYPESCRIPT · PYTHON · PHP · SQL</text>

  <!-- title block -->
  <g class="in" style="animation-delay:.25s">
    <rect x="800" y="70" width="340" height="200" rx="4" class="frame"/>
    <g class="rule"><line x1="800" y1="120" x2="1140" y2="120"/><line x1="800" y1="170" x2="1140" y2="170"/><line x1="800" y1="220" x2="1140" y2="220"/><line x1="892" y1="70" x2="892" y2="270"/></g>
  </g>
  
    <g class="row" style="animation-delay:0.35s">
      <text x="816" y="100" class="k">BASE</text>
      
      <text x="904" y="100" class="v">Igualada, Catalonia</text>
    </g>
    <g class="row" style="animation-delay:0.47s">
      <text x="816" y="150" class="k">NOW</text>
      
      <text x="904" y="150" class="v">DAM student · NuviaDev</text>
    </g>
    <g class="row" style="animation-delay:0.59s">
      <text x="816" y="200" class="k">ROLE</text>
      
      <text x="904" y="200" class="v">CEO &amp; Co-founder</text>
    </g>
    <g class="row" style="animation-delay:0.71s">
      <text x="816" y="250" class="k">STATUS</text>
      <circle cx="912" cy="246" r="4.5" fill="#1f7a4a"/><circle cx="912" cy="246" r="4.5" fill="none" stroke="#1f7a4a" class="pulse"/>
      <text x="926" y="250" class="v sig">Available for projects</text>
    </g>

  <text x="1140" y="302" class="meta in" text-anchor="end" style="animation-delay:.6s">41.58° N · 1.62° E</text>
</svg>
